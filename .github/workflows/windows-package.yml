name: Windows packages

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, release/windows-acceptance, codex/android-0.5-windows-fix]
    paths:
      - .github/workflows/windows-package.yml
      - packaging/windows/**
      - backend/**
      - player/**
      - desktop.py
      - desktop_shell.py
      - start.py
      - tools/prepare_portable.py

permissions:
  contents: read

jobs:
  package:
    name: Build and check Windows x64 packages
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
          architecture: x64

      - name: Prepare compiler and redistributables
        id: inputs
        run: |
          $bundledCompiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path $bundledCompiler)) {
              choco install innosetup --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $inputs = .\packaging\windows\GET_BUILD_INPUTS.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'slynor-inputs') -UseSystemWebView2
          foreach ($key in $inputs.Keys) { "$key=$($inputs[$key])" >> $env:GITHUB_OUTPUT }

      - name: Build and smoke-test packages
        env:
          OWNPLAYER_BUILD_NATIVE: ${{ steps.inputs.outputs.native }}
          OWNPLAYER_BUILD_EMBED: ${{ steps.inputs.outputs.embed }}
          OWNPLAYER_BUILD_EMBED_SHA256: ${{ steps.inputs.outputs.embed_sha256 }}
        run: .\packaging\windows\BUILD_WINDOWS.ps1 -PythonPath (Get-Command python.exe).Source -UseSystemWebView2

      - name: Install and check the slim Setup
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Slynor test install'
          $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $install + '"'))
          $setup = Start-Process -FilePath .\dist\installer\Slynor-Setup.exe -ArgumentList $setupArgs -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup exited with code $($setup.ExitCode)" }
          if (Test-Path (Join-Path $install 'webview2')) { throw 'Setup installed bundled WebView2' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'slynor-installed-check'
          $check = Start-Process -FilePath (Join-Path $install 'Slynor.exe') -ArgumentList '--smoke-test' -PassThru
          if (-not $check.WaitForExit(90000)) { $check.Kill(); throw 'Installed Slynor timed out' }
          if ($check.ExitCode -ne 0) { throw "Installed Slynor failed its smoke test ($($check.ExitCode))" }

      - name: Open the installed desktop window with the usual port occupied
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'Slynor test install'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'slynor-installed-check'
          $log = Join-Path $env:LOCALAPPDATA 'Slynor\logs\startup.log'
          $occupied = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 8765)
          $occupied.Start()
          $app = $null
          try {
              $app = Start-Process -FilePath (Join-Path $install 'Slynor.exe') -PassThru
              $deadline = [DateTime]::UtcNow.AddSeconds(60)
              do {
                  $app.Refresh()
                  if ($app.HasExited) { throw "Installed Slynor exited before showing its window ($($app.ExitCode))" }
                  if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -eq 'Slynor') {
                      $reservation = Select-String -LiteralPath $log -Pattern 'Desktop API reserved (http://127\.0\.0\.1:(\d+))' | Select-Object -Last 1
                      if (-not $reservation -or $reservation.Matches[0].Groups[2].Value -eq '8765') { throw 'Slynor did not switch to a free port.' }
                      $url = $reservation.Matches[0].Groups[1].Value
                      $ui = Invoke-WebRequest -Uri "$url/ui" -UseBasicParsing -TimeoutSec 5
                      if ($ui.StatusCode -ne 200 -or $ui.Content -notmatch 'Slynor') { throw 'UI did not load on the reserved port.' }
                      break
                  }
                  Start-Sleep -Milliseconds 500
              } while ([DateTime]::UtcNow -lt $deadline)
              if (-not $ui) { throw 'The installed Slynor window did not open within 60 seconds.' }
          } finally {
              $occupied.Stop()
              if ($app -and -not $app.HasExited -and (-not $app.CloseMainWindow() -or -not $app.WaitForExit(10000))) {
                  taskkill /PID $app.Id /T /F
              }
          }

      - name: Upload Setup and portable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Slynor-Windows-x64
          path: |
            dist/installer/Slynor-Setup.exe
            dist/Slynor-Portable.zip
            build-logs/SHA256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-packaging-logs
          path: |
            build-logs/
            ${{ runner.temp }}/slynor-installed-check/Slynor/logs/
          if-no-files-found: ignore
          retention-days: 7
