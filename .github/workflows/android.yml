name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [release/windows-acceptance]
    paths: [android/**, .github/workflows/android.yml]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install SDK and build APK
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Slynor-Android-debug.apk
          sha256sum Slynor-Android-debug.apk > SHA256.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Slynor-Android-APK
          path: |
            android/Slynor-Android-debug.apk
            android/SHA256.txt
          if-no-files-found: error
          retention-days: 7
