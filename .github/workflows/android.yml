name: Android APK

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_SIGNING_KEYSTORE_B64:
        required: false
      ANDROID_SIGNING_STORE_PASSWORD:
        required: false
      ANDROID_SIGNING_KEY_ALIAS:
        required: false
      ANDROID_SIGNING_KEY_PASSWORD:
        required: false
  push:
    branches: [main, release/windows-acceptance, codex/android-0.5-windows-fix]
    paths: [android/**, .github/workflows/android.yml]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install SDK and build APK
        id: build
        working-directory: android
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_B64 }}
          SLYNOR_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SLYNOR_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SLYNOR_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          fi
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          variant=Debug
          package=io.github.hyoreku.slynor.debug
          filename=Slynor-Android-debug.apk
          if [[ -n "$SIGNING_KEYSTORE_B64$SLYNOR_SIGNING_STORE_PASSWORD$SLYNOR_SIGNING_KEY_ALIAS$SLYNOR_SIGNING_KEY_PASSWORD$SIGNING_CERT_SHA256" ]]; then
            : "${SIGNING_KEYSTORE_B64:?Missing ANDROID_SIGNING_KEYSTORE_B64}"
            : "${SLYNOR_SIGNING_STORE_PASSWORD:?Missing ANDROID_SIGNING_STORE_PASSWORD}"
            : "${SLYNOR_SIGNING_KEY_ALIAS:?Missing ANDROID_SIGNING_KEY_ALIAS}"
            : "${SLYNOR_SIGNING_KEY_PASSWORD:?Missing ANDROID_SIGNING_KEY_PASSWORD}"
            [[ "$SIGNING_CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
            umask 077
            export SLYNOR_SIGNING_STORE_FILE
            SLYNOR_SIGNING_STORE_FILE=$(mktemp "$RUNNER_TEMP/slynor-signing.XXXXXX")
            trap 'rm -f -- "$SLYNOR_SIGNING_STORE_FILE"' EXIT
            printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$SLYNOR_SIGNING_STORE_FILE"
            unset SIGNING_KEYSTORE_B64
            variant=Release
            package=io.github.hyoreku.slynor
            filename=Slynor-Android.apk
          fi
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk="app/build/outputs/apk/${variant,,}/app-${variant,,}.apk"
          ./gradlew --no-daemon ":app:assemble$variant" -PslynorUpgradeFixture=true
          cp "$apk" "$RUNNER_TEMP/slynor-upgrade-fixture.apk"
          ./gradlew --no-daemon ":app:lint$variant" ":app:assemble$variant"
          report=$("$signer" verify --print-certs "$apk")
          if [[ "$variant" == Release ]]; then
            fingerprint=$(awk '/^Signer #1 certificate SHA-256 digest:/ {print $NF}' <<< "$report")
            [[ "$fingerprint" == "${SIGNING_CERT_SHA256,,}" ]] || { echo "Unexpected APK signing certificate" >&2; exit 1; }
          fi
          cp "$apk" "$filename"
          sha256sum "$filename" > SHA256.txt
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Slynor-Android-APK
          path: |
            android/${{ steps.build.outputs.filename }}
            android/SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Check Android screens on the emulator
        timeout-minutes: 12
        working-directory: android
        env:
          SLYNOR_PACKAGE: ${{ steps.build.outputs.package }}
          SLYNOR_APK: ${{ steps.build.outputs.filename }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/slynor-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          fi
          image='system-images;android-35;google_apis;x86_64'
          "$sdkmanager" emulator platform-tools "$image"
          echo no | "$(dirname "$sdkmanager")/avdmanager" create avd --name slynor-ui --package "$image" --force
          test -s "$ANDROID_AVD_HOME/slynor-ui.ini"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd slynor-ui -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/slynor-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill || true' EXIT
          booted=false
          for attempt in {1..105}; do
            if [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then
              booted=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            tail -60 "$RUNNER_TEMP/slynor-emulator.log"
            exit 1
          fi
          adb shell wm dismiss-keyguard
          if [[ "$SLYNOR_PACKAGE" != *.debug ]]; then
            adb root
            adb wait-for-device
            test "$(adb shell id -u | tr -d '\r')" = 0
          fi
          adb install "$RUNNER_TEMP/slynor-upgrade-fixture.apk"
          adb shell am start -W -n "$SLYNOR_PACKAGE/io.github.hyoreku.slynor.MainActivity"
          export SLYNOR_UPGRADE_APK="$PWD/$SLYNOR_APK"
          if ! python3 tools/check_ui.py "$RUNNER_TEMP/slynor-ui"; then
            adb logcat -d -s ExoPlayerImplInternal DefaultAudioSink | tail -80
            adb logcat -d -s AndroidRuntime | tail -60
            exit 1
          fi

      - name: Upload Android screen captures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Slynor-Android-UI
          path: ${{ runner.temp }}/slynor-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
