name: Android APK

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, release/windows-acceptance, codex/android-0.5-windows-fix]
    paths: [android/**, .github/workflows/android.yml]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install SDK and build APK
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          fi
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          ./gradlew --no-daemon :app:lintDebug :app:assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Slynor-Android-debug.apk
          sha256sum Slynor-Android-debug.apk > SHA256.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Slynor-Android-APK
          path: |
            android/Slynor-Android-debug.apk
            android/SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Check Android screens on the emulator
        timeout-minutes: 12
        working-directory: android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/slynor-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)
          fi
          image='system-images;android-35;google_apis;x86_64'
          "$sdkmanager" emulator platform-tools "$image"
          echo no | "$(dirname "$sdkmanager")/avdmanager" create avd --name slynor-ui --package "$image" --force
          test -s "$ANDROID_AVD_HOME/slynor-ui.ini"
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd slynor-ui -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/slynor-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill || true' EXIT
          booted=false
          for attempt in {1..105}; do
            if [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then
              booted=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            tail -60 "$RUNNER_TEMP/slynor-emulator.log"
            exit 1
          fi
          adb shell wm dismiss-keyguard
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n io.github.hyoreku.slynor.debug/io.github.hyoreku.slynor.MainActivity
          if ! python3 tools/check_ui.py "$RUNNER_TEMP/slynor-ui"; then
            adb logcat -d -s AndroidRuntime | tail -60
            exit 1
          fi

      - name: Upload Android screen captures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Slynor-Android-UI
          path: ${{ runner.temp }}/slynor-ui/*.png
          if-no-files-found: ignore
          retention-days: 7
