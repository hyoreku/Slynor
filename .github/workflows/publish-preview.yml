name: Publish Slynor preview

on:
  push:
    tags: [v0.23.0-preview.2]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and download tested packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          git diff --exit-code 395a327bd02435f17ca358d22cc1c6c9df09481b HEAD -- \
            backend player service frontend telegram_bot desktop.py desktop_shell.py \
            start.py window_geometry.py packaging requirements tools/prepare_portable.py
          git diff --exit-code c436b9709ddde78606cb358193b69a4da6261ae5 HEAD -- android

          cd "$RUNNER_TEMP"
          mkdir release-assets
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14727922924/zip" > windows.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/14728091676/zip" > android.zip
          sha256sum --check <<'EOF'
          558b6b18ffc9ca2dc0067b3930912d2c38a9abb30d4a52851a37e297a1806048  windows.zip
          1c4690d04d91a9368eae9db632858723f6e6370d34d4f6674da11dd950f68353  android.zip
          EOF
          unzip -j windows.zip '*Slynor-Setup.exe' '*Slynor-Portable.zip' -d release-assets
          unzip -j android.zip '*Slynor-Android-debug.apk' -d release-assets
          cd release-assets
          sha256sum Slynor-Setup.exe Slynor-Portable.zip Slynor-Android-debug.apk > SHA256SUMS.txt

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release-assets"
          cat > notes.md <<'EOF'
          ### Windows x64

          Мини-плеер плавно сворачивается через 15 секунд после ухода курсора. Компактный режим сохраняет фон и показывает обложку и спектр. Наведение раскрывает управление.

          `Slynor-Setup.exe` весит 220 МиБ. Portable-архив `Slynor-Portable.zip` весит 336 МиБ. Для запуска portable распакуйте архив целиком и откройте `Slynor.exe`. Пакеты без цифровой подписи и используют установленный [Microsoft Edge WebView2 Runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/#download).

          ### Android 8+

          В Android 0.2.0 добавлены главная, поиск по локальной библиотеке, очередь и экран трека с обложкой и перемоткой. Установка и запуск главной проверены на эмуляторе Android 15. `Slynor-Android-debug.apk` подписан отладочным ключом. Обновление поверх установленной версии требует совпадения ключей подписи.

          Контрольные суммы файлов в `SHA256SUMS.txt`.

          [Сборка и проверка пакетов Windows](https://github.com/hyoreku/Slynor/actions/runs/44956779157) · [Сборка APK и запуск на эмуляторе](https://github.com/hyoreku/Slynor/actions/runs/44957407821)
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title 'Slynor v0.23.0 Preview 2' --notes-file notes.md \
            Slynor-Setup.exe Slynor-Portable.zip Slynor-Android-debug.apk SHA256SUMS.txt
