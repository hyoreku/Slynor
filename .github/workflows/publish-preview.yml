name: Publish Slynor preview

on:
  push:
    tags: ['v*-preview.*']

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tagged commit from main
        run: git merge-base --is-ancestor HEAD origin/main

  windows:
    needs: verify-source
    uses: ./.github/workflows/windows-package.yml

  android:
    needs: verify-source
    uses: ./.github/workflows/android.yml

  publish:
    needs: [windows, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: Slynor-Windows-x64
          path: input/windows
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: Slynor-Android-APK
          path: input/android
      - name: Publish tested builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          mkdir release-assets
          while IFS= read -r filename; do
            file=$(find input/windows -type f -name "$filename" -print -quit)
            test -n "$file"
            cp "$file" release-assets/
          done <<'FILES'
          Slynor-Setup.exe
          Slynor-Portable.zip
          FILES
          (cd input/android && sha256sum --check SHA256.txt)
          cp input/android/Slynor-Android-debug.apk release-assets/
          cd release-assets
          sha256sum Slynor-Setup.exe Slynor-Portable.zip Slynor-Android-debug.apk > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --prerelease --title "Slynor $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" \
            Slynor-Setup.exe Slynor-Portable.zip Slynor-Android-debug.apk SHA256SUMS.txt
