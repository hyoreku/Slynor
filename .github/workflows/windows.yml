name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Windows x64 source runtime
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64

      - name: Install native runtime tools
        run: |
          $vlc = Join-Path $env:ProgramFiles 'VideoLAN\VLC'
          if (-not (Test-Path (Join-Path $vlc 'libvlc.dll'))) {
              choco install vlc --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or
              -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
              choco install ffmpeg --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $libvlc = Join-Path $vlc 'libvlc.dll'
          $plugins = Join-Path $vlc 'plugins'
          if (-not (Test-Path $libvlc -PathType Leaf) -or -not (Test-Path $plugins -PathType Container)) {
              throw 'VLC x64 runtime or plugins are missing.'
          }
          "PYTHON_VLC_LIB_PATH=$libvlc" >> $env:GITHUB_ENV
          "PYTHON_VLC_MODULE_PATH=$plugins" >> $env:GITHUB_ENV
          "VLC_PLUGIN_PATH=$plugins" >> $env:GITHUB_ENV
          $vlc >> $env:GITHUB_PATH
          (Join-Path $env:ChocolateyInstall 'bin') >> $env:GITHUB_PATH

      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements/validated/gui-win-py313.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check

      - name: Run Python tests
        id: tests
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP 'slynor-unittest.txt'
          python -m unittest discover -s tests 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
              Select-String -Path $testLog -Pattern '^(?:FAIL|ERROR): [A-Za-z0-9_]+(?: \([A-Za-z0-9_.]+\))?' |
                  ForEach-Object { "::error::$($_.Matches[0].Value)" | Write-Host }
          }
          exit $testExit

      - name: Check Windows runtime and local HTTP
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'slynor-check'
          python start.py --smoke-test
          $smokeExit = $LASTEXITCODE
          $report = Join-Path $env:LOCALAPPDATA 'Slynor\logs\smoke-check.json'
          if (Test-Path $report) {
              $checks = (Get-Content -Raw $report | ConvertFrom-Json).checks
              foreach ($check in $checks.PSObject.Properties) {
                  if (-not $check.Value.ok) { Write-Host "::error::Runtime check failed: $($check.Name)" }
              }
          }
          exit $smokeExit

      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-runtime-check
          path: ${{ runner.temp }}/slynor-check/Slynor/logs/smoke-check.json
          if-no-files-found: ignore
          retention-days: 7
