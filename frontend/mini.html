<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slynor · Миниплеер</title><link rel="stylesheet" href="/static/css/mini.css"><link rel="stylesheet" href="/static/assets/icons/icons.css">
<link rel="icon" href="/static/assets/icons/app.ico"></head><body class="mini-window">
<main><div class="song"><div id="mini-cover" aria-hidden="true">♫</div><div class="identity pywebview-drag-region" title="Перетащите миниплеер"><strong id="mini-title">Нет выбранной песни</strong><span id="mini-artist"></span><span id="mini-time"></span></div><button id="mini-hide" title="Скрыть в трей" aria-label="Скрыть в трей">−</button><button id="mini-expand" title="Открыть полный плеер" aria-label="Открыть полный плеер">↗</button></div>
<div class="controls"><button data-action="previous" title="Предыдущий трек" aria-label="Предыдущий трек">⏮</button><button id="mini-toggle" title="Пауза / Продолжить" aria-label="Пауза / Продолжить" disabled>▶</button><button data-action="next" title="Следующий трек" aria-label="Следующий трек">⏭</button><button data-action="stop" title="Стоп" aria-label="Стоп">■</button><label for="mini-volume">♪</label><input id="mini-volume" type="range" min="0" max="100" value="50" aria-label="Громкость"></div>
<p id="mini-error" role="status" hidden></p></main><script src="/static/js/cover-effects.js" defer></script><script src="/static/js/mini-appearance.js" defer></script><script src="/static/js/mini.js" defer></script><script src="/static/js/icons.js" defer></script>
</body></html>
